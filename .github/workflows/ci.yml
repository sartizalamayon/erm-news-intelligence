name: CI

# Runs on every push and PR. Must stay green with a near-empty test
# suite (DoD #5) and must NEVER call a real LLM provider or the live
# internet — every env var below is blank/fake on purpose, and
# tests/conftest.py enforces the same for anything that imports pytest
# directly (e.g. a local `pytest` run without this workflow's env block).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      DATABASE_URL: ""
      SECRET_KEY: ""
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install app package + dev tools
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type-check (mypy)
        run: mypy app

      - name: Test
        run: pytest

      - name: Batch entrypoint smoke check
        # DoD #1: the batch CLI must be runnable independently of the web
        # app. Runs the real no-op (app.batch.run_daily.main) end to end,
        # not just imported.
        run: python -m app.batch
