name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erm_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      DATABASE_URL: ""
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erm_ci_test
      SECRET_KEY: ""
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install app package + dev tools
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type-check (mypy)
        run: mypy app

      - name: Verify database is reachable (fail loudly, not a silent skip)
        run: |
          python3 - <<'PY'
          import sys
          from app.db.testing import pg_available

          if not pg_available():
              print("FATAL: Postgres unreachable via TEST_DATABASE_URL.", file=sys.stderr)
              sys.exit(1)
          print("Postgres reachable via TEST_DATABASE_URL -- proceeding.")
          PY

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erm_ci_test
        run: python -m app.db.migrate

      - name: Test
        run: pytest

      - name: Set up Node (frontend tests)
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test (frontend)
        if: matrix.python-version == '3.12'
        run: node --test "tests/frontend/"*.test.mjs

      - name: Batch entrypoint smoke check (offline)
        env:
          http_proxy: http://127.0.0.1:1
          https_proxy: http://127.0.0.1:1
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          no_proxy: ""
          NO_PROXY: ""
        run: |
          python3 - <<'PY'
          import runpy
          import sys

          from tests.helpers.network_guard import block_network

          block_network()
          try:
              runpy.run_module("app.batch", run_name="__main__")
          except SystemExit as exc:
              code = exc.code if isinstance(exc.code, int) else 0
          else:
              code = 0
          print(f"Batch entrypoint exited {code} with all outbound network blocked.")
          sys.exit(code)
          PY
