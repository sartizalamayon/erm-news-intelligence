# Render Blueprint (https://render.com/docs/blueprint-spec) for the two
# Render-hosted surfaces this project's ADR rules (ADR §1, §9.4 —
# /Users/ayo_on/Documents/news-intel-rebuild/docs/architecture-decision-record.md):
# the API on a Render free web service, the frontend on a Render Static
# Site. The database (Supabase Postgres free) and the batch job (GitHub
# Actions cron, .github/workflows/daily-batch.yml) are NOT Render
# services and have nothing to declare here.
#
# Committed config only — nobody has run `render blueprint launch`
# against a real account for this task (explicit constraint: no real
# Render/Supabase account, no deploy performed here). The owner connects
# this repo from the Render dashboard ("New +" → "Blueprint") to actually
# provision these two services from this file. See
# docs/deployment.md (news-intel-rebuild repo) for the full walkthrough
# and README-rebuild.md for the required-env-vars table.
#
# Secrets: every envVar below with `sync: false` and no `value` is a
# secret Render prompts the owner to fill in at blueprint-launch time (or
# later, in the dashboard) — never a real value in this file, ever.

services:
  # ── API: FastAPI + uvicorn (ADR §1: Render free web service) ────────
  - type: web
    name: erm-backend
    runtime: python
    plan: free
    buildCommand: pip install -e .
    # Migrations run here, chained with `&&` into the start command —
    # deliberately NOT Render's `preDeployCommand` hook, even though
    # that would otherwise be the natural place: Render's own docs state
    # pre-deploy commands are "available for paid web services, private
    # services, and background workers" — free web services (this
    # service's plan, ADR §1) don't get one. Chaining into startCommand
    # instead means `python -m app.db.migrate` (the project's own
    # deterministic runner, migrations/*.sql, app/db/migrate.py — never
    # hand-maintained SQL) runs on every deploy AND every free-tier
    # cold-start wake from the 15-minute idle sleep, both of which are
    # exactly the moments "before the API serves traffic" needs to hold.
    # Cheap to pay on every wake: run_migrations() is idempotent, a
    # single fast SELECT against schema_migrations when nothing is
    # pending (storage-policy.md §8, docs/deployment.md). `&&`
    # short-circuits on migration failure — uvicorn never starts, so a
    # broken migration fails the deploy loudly instead of serving
    # traffic against a schema migrations/*.sql doesn't agree with.
    #
    # NO `--forwarded-allow-ips`, ON PURPOSE — this is a decision, not
    # an omission, and the obvious "fix" is a security regression.
    # Render terminates TLS and forwards plain HTTP, so uvicorn's
    # default (`forwarded_allow_ips=127.0.0.1`, and Render's proxy is
    # not on loopback) leaves `request.url.scheme` as "http". The
    # tempting one-flag repair is `--forwarded-allow-ips="*"`. Read
    # uvicorn's own ProxyHeadersMiddleware before doing that: the same
    # flag that fixes the scheme ALSO overwrites `scope["client"]`, and
    # with `*` it takes the LEFTMOST X-Forwarded-For entry — the one
    # position a caller fully controls, since every proxy appends rather
    # than replaces. `app.api.routers.auth._client_ip` and
    # `app.middleware.rate_limit.resolve_client_ip` both fall back to
    # `request.client.host`, and TRUSTED_PROXY_HOPS=0 (the fail-safe
    # default, and what any unparsable value resolves to) makes that
    # fallback the ONLY path. So `*` would turn "trust nothing" into
    # "trust the header verbatim" precisely when the security-critical
    # setting is at its safest value — reopening the per-IP OTP
    # rate-limit bypass RT-5 found (docs/red-team-findings.md).
    # The scheme problem is instead solved where it actually bites, in
    # app.main (`redirect_slashes=False`); see that call's comment.
    startCommand: "python -m app.db.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    # Readiness, not liveness — verifies DB reachability with a real
    # `SELECT 1` (app/api/routers/health.py's new `GET /health/ready`),
    # not app.main's existing `/healthz` (deliberately a zero-dependency
    # liveness probe only, see that route's own docstring). Render has
    # exactly one health-check knob, used to gate when a deploy is
    # considered live and to decide whether to restart a wedged
    # instance — see docs/deployment.md's "liveness vs readiness"
    # section for the restart-loop tradeoff this implies if Supabase
    # itself has an outage, and why it's still the right call for a
    # single-instance free-tier service with no rolling deploys to
    # protect.
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # NO `PORT` ENTRY — deliberately removed. It used to be declared
      # here with `value: "8000"` and a comment admitting it was
      # "documented for clarity only", because Render injects its own
      # PORT regardless. Declaring a value the platform overwrites, next
      # to twelve entries that are all load-bearing, teaches the reader
      # that entries in this list might be decorative — and the matching
      # `Settings.port` field it appeared to configure has been removed
      # too (see app/config.py, where nothing ever read it). uvicorn
      # reads Render's real PORT directly in startCommand above.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # EMAIL_PROVIDER selects which of the two blocks below actually
      # sends OTP mail at runtime (app.services.email, app.config.Settings
      # .email_provider) — "brevo" is what this deployment actually uses
      # today, not "resend" (this file's own original default). Resend
      # stays fully configured below rather than removed: it's a real,
      # working alternative if this ever needs to switch back, at the
      # cost of two now-inert secrets when it isn't the active choice.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: ERM
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Brent crude card on the long-term dashboard (app.services.macro) —
      # degrades to an honest "unconfigured" state rather than failing
      # the deploy if this is left blank, but the card is dead without it.
      - key: OILPRICEAPI_KEY
        sync: false
      # SECURITY-CRITICAL — RT-5 (docs/red-team-findings.md), see
      # app.config.Settings.trusted_proxy_hops's own description and
      # README-rebuild.md / docs/deployment.md for the full writeup.
      # Render's own load balancer is exactly ONE reverse-proxy hop
      # between the real client and this process — it terminates TLS
      # and appends the real client IP as the rightmost X-Forwarded-For
      # entry before forwarding. 1 is correct for Render alone with
      # nothing else (no separate CDN/WAF) in front. Set higher than the
      # real hop count and an attacker-supplied X-Forwarded-For entry
      # becomes trusted as if a real proxy appended it — the exact RT-5
      # per-IP OTP rate-limit bypass. Set to 0 (or leave unset — 0 is
      # the fail-safe default) and every request behind Render's proxy
      # is seen as coming from the same IP, collapsing per-IP OTP limits
      # to a single shared bucket for every real client — not a security
      # hole, but it breaks the limiter's actual purpose.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # The Render Static Site's exact origin — must match the
      # erm-frontend service's real onrender.com URL (or a custom
      # domain, if one is later attached). app.main's own CORS
      # validation (_validate_cors_settings) fails fast at startup if
      # this is empty in production, and rejects a literal "*" outright
      # (invalid per spec once allow_credentials=True, which this API
      # requires for its cross-subdomain session cookie).
      - key: CORS_ALLOW_ORIGINS
        value: https://erm-frontend.onrender.com
      # ── LLM pipeline tuning knobs — REAL, and NOT declared below ────
      #
      # Deliberately listed as a COMMENT, not as envVars entries, because
      # every one of them is a working default today and adding nine
      # entries whose values equal their defaults would just be noise in
      # the dashboard. What matters is that they EXIST and that this file
      # is where an operator looks:
      #
      #   LLM_TRANSLATE, LLM_DEDUP, LLM_JUDGE, LLM_TOPIC   ("0" = off)
      #   LLM_BATCH (10), LLM_TOPIC_CHUNK (50),
      #   LLM_TOPIC_DEDUP_BATCH (8), TOPIC_PREFOLD_THRESH (0.82)
      #     — app/services/enrichment.py
      #   GROQ_RETRIES (4) — app/services/llm/transport.py, and NOT
      #     Groq-specific despite the name: it is the retry count for
      #     every OpenAI-compatible provider (Groq, Mistral, NVIDIA).
      #
      # These are read straight from `os.environ` inside those two
      # service modules rather than through `app.config.Settings`, which
      # breaks app/config.py's own stated rule and is why they are
      # invisible here in the first place: nothing derives this list from
      # them, and nothing validates them — LLM_BATCH="ten" is a crash
      # partway through a nightly run, not a rejected config. Migrating
      # them into Settings (which would put them in .env.example, in
      # render.yaml proper, and under the completeness test) is
      # outstanding work; see .env.example's matching section for each
      # knob's meaning and units. To set one, add it here as an ordinary
      # `- key: ... value: ...` entry.
      #
      # NOTE for whoever does the migration: the four stage switches use
      # `!= "0"` semantics, NOT pydantic's bool parsing — "false" and ""
      # currently mean ON. Preserve or deliberately change that; do not
      # convert them by accident.

  # ── Frontend: static files, NO build step (ADR §1: Render Static
  # Site; frontend/README.md: "No npm, no build step, no node_modules").
  # frontend/js/config.js resolves its API base at runtime (query param
  # → localStorage → same-origin heuristic → a hardcoded DEFAULT_PROD_API
  # constant), so there is no env-substitution step for this service to
  # run either — the one thing to edit at deploy time is that constant,
  # documented in frontend/js/config.js itself and README-rebuild.md.
  - type: web
    name: erm-frontend
    runtime: static
    staticPublishPath: frontend
    # Force revalidation on every load instead of trusting browser
    # heuristic caching. Render's docs (render.com/docs/static-sites,
    # render.com/docs/static-site-headers, fetched 2026-08-13) confirm
    # the CDN edge cache itself is purged immediately on every
    # successful deploy ("we deploy it and immediately invalidate our
    # CDN caches"), but say nothing about what Cache-Control value is
    # sent to the BROWSER by default — undocumented, not verified safe
    # to assume. Without an explicit header, browsers apply their own
    # heuristic freshness and can keep serving an old cached copy of a
    # same-named file for a long time after a deploy, same failure mode
    # already confirmed locally (see scripts/dev_frontend_server.py).
    # `path: /js/*` and `/css/*` mirror Render's own documented glob
    # example ("/blog/* matches /blog/ and all other paths under it"),
    # so they cover every file under those directories regardless of
    # nesting (frontend/js/screens/*.js, frontend/js/components/*.js
    # included) without relying on the less-clearly-documented `/**/*.ext`
    # depth semantics. `/` and `/index.html` are covered explicitly too
    # since the entry document was never confirmed exempt.
    headers:
      - path: /js/*
        name: Cache-Control
        value: no-cache
      - path: /css/*
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache

    # SPA history-API fallback. Every screen now has a real address
    # (frontend/js/route.js: /review, /sources, /dash/long ...), but
    # none of those are files on disk — without this rule a static host
    # answers 404 for all of them, so the router works while you click
    # and breaks the instant anyone reloads, bookmarks or shares a link.
    # That is the whole case routing exists to serve, so the rewrite is
    # not optional decoration.
    #
    # Syntax verified against Render's blueprint spec
    # (render.com/docs/blueprint-spec, fetched 2026-08-15): `routes` with
    # `type: rewrite`, and rewrite serves the destination's content AT
    # the original path rather than redirecting the browser — which is
    # what keeps the URL intact for `window.location` to read on boot.
    #
    # The local dev server implements the same fallback
    # (scripts/dev_frontend_server.py), including its narrowing: only
    # extensionless navigation requests are rewritten, so a genuinely
    # missing .js still 404s honestly instead of being served HTML.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
